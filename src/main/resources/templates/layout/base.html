<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">TSS - Pipeline de Análisis</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div>
        <div class="sidebar__header">
            <span class="sidebar__logo-icon">📊</span>
            <span class="sidebar__logo-text">TSS</span>
        </div>
        <ul class="sidebar__nav">
            <li class="sidebar__item">
                <a href="#" class="sidebar__link">Inicio</a>
            </li>
            <li class="sidebar__item">
                <a href="/encuestas/lista-encuestas" class="sidebar__link">Encuestas</a>
            </li>
            <li class="sidebar__item">
                <a href="#" class="sidebar__link">Datos</a>
            </li>
            <li class="sidebar__item">
                <a href="#" class="sidebar__link sidebar__link--active">Analisis de Datos</a>
            </li>
        </ul>
    </div>
</aside>

<!-- CONTENEDOR PRINCIPAL -->
<div class="main-layout">
    <header class="header">
        <h1 class="header__title" th:text="${title}">Analisis de Datos</h1>
        <div class="header__notifications">🔔</div>
    </header>

    <!-- CONTENIDO DINÁMICO -->
    <main th:replace="${content}"></main>

    <!-- FOOTER -->
    <footer class="footer">
        <span>2026© Hecho en la U</span>
        <div class="footer__links">
            <a href="#" class="footer__link">Soporte</a>
            <a href="#" class="footer__link">Nosotros</a>
        </div>
    </footer>
</div>

</body>
</html>
